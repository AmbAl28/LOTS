<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Кривое зеркало для видео</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        /* Container occupies full viewport */
        .container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        #sourceVideo, #effectCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        #sourceVideo { opacity: 0; pointer-events: none; }
        #effectCanvas { z-index: 10; }
        button { margin: 5px; padding: 8px 12px; font-size: 16px; }
        .controls { text-align: center; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 20; }
        .instruction { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: #fff; padding: 10px; border-radius: 4px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
    </style>
</head>
<body>
    <div class="controls">
        <button id="startBtn">Начать просмотр с эффектом</button>
        <button id="stopBtn" disabled>Остановить</button>
        <button id="fsBtn">⛶ Во весь экран</button>
        <select id="effectSelect">
            <option value="wave">Волна (кривое зеркало)</option>
            <option value="bulge">Выпуклость</option>
            <option value="invert">Инверсия цветов</option>
            <option value="grayscale">Чёрно‑белое</option>
            <option value="mirror">Зеркало (горизонталь)</option>
            <option value="pixelate">Пикселизация</option>
            <option value="twist">Твист (закручивание)</option>
            <option value="ripple">Рябь (круги на воде)</option>
        </select>
    </div>
  <!-- Wave effect control panel (hidden by default) -->
  <div id="wavePanel" class="wave-panel" style="display:none; position:absolute; top:80px; left:10px; background:rgba(0,0,0,0.6); color:#fff; padding:10px; border-radius:8px; z-index:20; min-width:200px;">
    <div style="font-weight:bold; margin-bottom:5px;">Настройки волны</div>
    <label>Амплитуда X: <input type="range" id="ampX" min="0" max="50" value="15" step="1"><span id="ampXVal">15</span></label><br>
    <label>Амплитуда Y: <input type="range" id="ampY" min="0" max="50" value="15" step="1"><span id="ampYVal">15</span></label><br>
    <label>Длина волны X: <input type="range" id="waveLenX" min="10" max="200" value="30" step="1"><span id="waveLenXVal">30</span></label><br>
    <label>Длина волны Y: <input type="range" id="waveLenY" min="10" max="200" value="30" step="1"><span id="waveLenYVal">30</span></label><br>
    <label>Скорость анимации: <input type="range" id="speed" min="0" max="5" value="1" step="0.1"><span id="speedVal">1</span></label><br>
    <label><input type="checkbox" id="centered"> Центрированная волна</label>
  </div>
    <div class="instruction" id="instructionBlock">
        Откройте видео в новой вкладке (YouTube, любой плеер).<br>
        Вернитесь на эту страницу.<br>
        Нажмите «Начать» и выберите вкладку с видео.<br>
        После успешного захвата потока будет показано сообщение: «Трансляция идёт, смотрите видео с эффектом ниже».
    </div>
    <div class="container">
        <video id="sourceVideo" autoplay playsinline muted></video>
        <canvas id="effectCanvas"></canvas>
    </div>
    <script src="app.js"></script>
</body>
</html>
